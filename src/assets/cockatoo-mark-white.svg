<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="title desc">
  <title id="title">Talk-Active one-colour speaking bird</title>
  <desc id="desc">A white full-body speaking bird inside a white speech-bubble outline for use on coloured apparel.</desc>
  <defs>
    <!-- One ink only. The silhouette matches the full-colour mark exactly; the
         fabric supplies every other colour. White reveals ink, black withholds
         it, so the eye and the wing edge stay open and the parted mandibles
         keep reading as a bird mid-sentence. -->
    <mask id="bird-cutouts">
      <rect width="64" height="64" fill="#000"/>
      <g transform="translate(2 1) scale(.92)">
        <g fill="#fff">
          <path d="M32 31 14 42l5 4 14-8Z"/>
          <path d="M33 36 20 47l6-1 9-6Z"/>
          <path d="M35 22c6 0 11 6 11 13 0 7-4 11-10 11-6 0-10-4-10-11 0-7 3-13 9-13Z"/>
          <circle cx="40" cy="21" r="8"/>
          <path d="M42 13c-2-6-7-9-13-8 4 1 6 4 7 7-3-1-6-1-8 1 5 0 8 2 10 5Z"/>
          <path d="M42 14c4 0 7 3 7 7s-3 7-7 7c-3 0-5-3-5-7s2-7 5-7Z"/>
          <path d="M46 16c5 1 9 3 10 5l-11 2Z"/>
          <path d="M46 25c4 0 7 1 9 3l-9 1Z"/>
          <path d="M36 45h2l-1 3 3 1h-6Zm5 0h2l-1 3 3 1h-6Z"/>
        </g>
        <path d="M32 29c5-1 8 3 8 8 0 4-2 7-5 9" fill="none" stroke="#000" stroke-width="2.2" stroke-linecap="round"/>
        <circle cx="44" cy="20" r="2.2" fill="#000"/>
      </g>
    </mask>
  </defs>
  <path d="M14 5h36a9 9 0 0 1 9 9v26a9 9 0 0 1-9 9h-6l4 8-12-8H14a9 9 0 0 1-9-9V14a9 9 0 0 1 9-9Z" fill="none" stroke="#fffef9" stroke-width="3" stroke-linejoin="round"/>
  <rect width="64" height="64" fill="#fffef9" mask="url(#bird-cutouts)"/>
</svg>
