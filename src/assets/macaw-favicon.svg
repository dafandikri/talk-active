<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="title desc">
  <title id="title">Talk-Active</title>
  <desc id="desc">The head of a blue and gold macaw, cropped for very small sizes.</desc>

  <!-- A FAVICON IS NOT A SMALL LOGO.
       At 16px the full lockup — outline bubble, whole bird, three dots — is
       roughly 4 shapes competing for 256 pixels, and all of them lose. This
       crops to the one part that stays recognisable: crown, face, eye, hook.
       Token colours, same as macaw-mark.svg. -->

  <!-- Warm ground so the mark holds its shape against any browser tab colour,
       light or dark. -->
  <rect width="64" height="64" rx="14" fill="#2f5923"/>

  <!-- Nape and crown fill the frame: the head IS the icon. -->
  <circle cx="30" cy="33" r="24" fill="#3a731f"/>

  <!-- White face patch, big enough that the eye has somewhere to sit. -->
  <path fill="#fffef9" d="M34 10c11 0 18 10 18 23s-7 23-18 23c-9 0-15-10-15-23s6-23 15-23Z"/>

  <!-- Gold cheek: without one colour of chest the head reads as a magpie. -->
  <path fill="#f2b90c" d="M24 44c4 6 9 9 14 9-6 3-13 1-17-3Z"/>

  <!-- The eye, oversized on purpose. Below ~20px this is the only feature the
       viewer actually resolves, so it carries the whole mark. -->
  <circle cx="36" cy="28" r="6.5" fill="#101312"/>
  <circle cx="33.6" cy="25.6" r="2.2" fill="#fffef9"/>

  <!-- The hooked beak, parted. This is the second-most-legible feature and the
       only one that distinguishes a macaw from any other round bird. -->
  <path fill="#101312" d="M45 20c9 2 15 8 15 15 0 6-5 11-12 12 5-4 7-8 7-12 0-6-4-11-10-15Z"/>
  <path fill="#bf6b04" d="M47 45c4 1 7 2 9 4l-11 1Z"/>
</svg>
