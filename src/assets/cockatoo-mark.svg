<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="title desc">
  <title id="title">Talk-Active speaking bird</title>
  <desc id="desc">A full-body blue, green, yellow, and orange speaking bird inside a black speech bubble.</desc>
  <path fill="#101312" d="M13 3h38a10 10 0 0 1 10 10v28a10 10 0 0 1-10 10h-7l4 9-13-9H13A10 10 0 0 1 3 41V13A10 10 0 0 1 13 3Z"/>

  <!-- The tail starts inside the body, so the bird reads as one animal. -->
  <path fill="#145f7e" d="M32 31 14 42l5 4 14-8Z"/>
  <path fill="#1b7ea6" d="M33 36 20 47l6-1 9-6Z"/>

  <!-- Upright body: clearly taller than wide, tapering towards the tail. -->
  <path fill="#f2b90c" d="M35 22c6 0 11 6 11 13 0 7-4 11-10 11-6 0-10-4-10-11 0-7 3-13 9-13Z"/>

  <!-- A narrow green back leaves the yellow chest visible from the front. -->
  <path fill="#2f5923" d="M33 22c-4 2-7 7-8 13-1 5 0 9 2 10-1-8 0-16 6-23Z"/>

  <!-- Green crown; the head is narrower than the body, as a bird's is. -->
  <circle cx="40" cy="21" r="8" fill="#2f5923"/>
  <path fill="#3a731f" d="M42 13c-2-6-7-9-13-8 4 1 6 4 7 7-3-1-6-1-8 1 5 0 8 2 10 5Z"/>

  <!-- White face patch keeps the eye readable when the mark is very small. -->
  <path fill="#fffef9" d="M42 14c4 0 7 3 7 7s-3 7-7 7c-3 0-5-3-5-7s2-7 5-7Z"/>
  <circle cx="44" cy="20" r="2.2" fill="#101312"/>
  <circle cx="43.4" cy="19.4" r=".7" fill="#fffef9"/>

  <!-- A visibly open orange beak: the mandibles part into a V, so the bird
       still reads as speaking at favicon size. -->
  <path fill="#bf6b04" d="M46 16c5 1 9 3 10 5l-11 2Z"/>
  <path fill="#bf6b04" d="M46 25c4 0 7 1 9 3l-9 1Z"/>

  <!-- One compact blue wing, small enough to leave a yellow chest. -->
  <path fill="#1b7ea6" d="M32 29c5-1 8 3 8 8 0 4-2 7-5 9 1-6 0-12-3-17Z"/>
  <path fill="#145f7e" d="M34 34c2 1 4 4 4 6 0 2-1 4-2 5 0-4 0-8-2-11Z"/>

  <path fill="#bf6b04" d="M36 45h2l-1 3 3 1h-6Zm5 0h2l-1 3 3 1h-6Z"/>
</svg>
