<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="title desc">
  <title id="title">Talk-Active speaking bird</title>
  <desc id="desc">A full-body blue, green, yellow, and orange speaking bird inside a black speech bubble.</desc>
  <path fill="#101312" d="M12 3h40a9 9 0 0 1 9 9v33a9 9 0 0 1-9 9h-5l3 8-13-8H12a9 9 0 0 1-9-9V12a9 9 0 0 1 9-9Z"/>

  <!-- A bright crest makes the silhouette unmistakably avian at favicon size. -->
  <path fill="#3a731f" d="M32 19c-2-8 1-12 4-15 0 6 2 9 5 12-1-7 3-10 6-12-1 6 0 10 2 14l-17 1Z"/>

  <!-- Long tail + upright body keep the mascot full-body, never a floating head. -->
  <path fill="#145f7e" d="M25 39c1 6 0 13-2 20l7-7 2 9 5-15-12-7Z"/>
  <path fill="#1b7ea6" d="M30 38c3 5 4 12 3 20l6-9 2 7 3-17-14-1Z"/>
  <path fill="#f2b90c" d="M29 26c4-7 14-9 20-4 5 4 5 12 1 18-3 5-8 9-14 9-7 0-11-5-11-11 0-5 1-9 4-12Z"/>
  <path fill="#2f5923" d="M28 27c3-8 12-12 20-7-4 1-7 4-8 8-5-2-8-2-12-1Z"/>

  <!-- Layered wing gives the small mark the same blue feather identity as Kato. -->
  <path fill="#1b7ea6" d="M29 31c7-4 14 0 15 7 0 5-4 9-10 11 2-5 1-11-5-18Z"/>
  <path fill="#145f7e" d="M32 35c5 1 8 4 9 8-2 3-4 5-7 6 1-5 0-9-2-14Z"/>

  <!-- White face, eye, and visibly open orange beak: this is a bird that speaks. -->
  <path fill="#fffef9" d="M40 18c6-1 11 2 13 7-1 5-4 8-9 9-5-2-7-7-6-12l2-4Z"/>
  <circle cx="46" cy="23" r="2" fill="#101312"/>
  <circle cx="45.5" cy="22.5" r=".6" fill="#fffef9"/>
  <path fill="#bf6b04" d="M51 23c5-1 9 1 11 4-2 2-5 4-10 4l-1-8Z"/>
  <path fill="#f2b90c" d="M52 32c4 0 7-1 9-3-1 4-4 6-8 6l-1-3Z"/>
  <path fill="#101312" d="M51 30c4-1 7-1 10-3-1 3-4 5-9 5l-1-2Z"/>

  <!-- Tiny feet ground the character without needing a perch. -->
  <path fill="#bf6b04" d="M34 47h2l-1 5 3 1h-6l2-6Zm8-1h2l-1 5 3 1h-6l2-6Z"/>
</svg>
