<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="title desc">
  <title id="title">Talk-Active one-colour speaking bird</title>
  <desc id="desc">A white macaw perched inside a white speech-bubble outline, for dark surfaces and apparel.</desc>

  <defs>
    <!-- One ink only. The silhouette matches macaw-mark.svg exactly; the
         surface behind supplies every other colour. White reveals ink, black
         withholds it — so the eye stays open, the wing edge stays visible, and
         the parted beak still reads as a bird mid-sentence rather than a blob. -->
    <mask id="macaw-cutouts">
      <rect width="64" height="64" fill="#000"/>
      <g fill="#fff">
        <path d="M21 38 11 51l4 2 8-11Z"/>
        <path d="M24 39 16 52l5-1 6-9Z"/>
        <path d="M24 22c6 0 10 5 10 11s-4 10-10 10-10-4-10-10 4-11 10-11Z"/>
        <circle cx="27" cy="19" r="7.5"/>
        <path d="M34 15c5 0 9 3 9 6 0 3-3 5-6 5 3-2 4-3 4-5s-3-5-7-6Z"/>
        <path d="M35 25c3 0 5 1 6 2l-7 1Z"/>
        <path d="M17 44h16v2.5H17Z"/>
      </g>

      <!-- Withheld ink: these keep the bird legible as a single white shape. -->
      <path d="M21 23c-5 2-8 7-8 13 0 4 1 6 3 8" fill="none" stroke="#000" stroke-width="2.2" stroke-linecap="round"/>
      <circle cx="30.5" cy="18.2" r="2.1" fill="#000"/>
      <path d="M29 12.5c4 0 6.5 3 6.5 6.5s-2.5 6.5-6.5 6.5" fill="none" stroke="#000" stroke-width="1.6"/>
    </mask>
  </defs>

  <path d="M17 7h30a9 9 0 0 1 9 9v19a9 9 0 0 1-9 9H36l-7 7-1-7H17a9 9 0 0 1-9-9V16a9 9 0 0 1 9-9Z"
        fill="none" stroke="#fffef9" stroke-width="3.5" stroke-linejoin="round"/>

  <circle cx="41" cy="25" r="2.7" fill="#fffef9"/>
  <circle cx="47" cy="25" r="2.7" fill="#fffef9"/>
  <circle cx="53" cy="25" r="2.7" fill="#fffef9"/>

  <rect width="64" height="64" fill="#fffef9" mask="url(#macaw-cutouts)"/>
</svg>
